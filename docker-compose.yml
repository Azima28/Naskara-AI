services:
  # 1. Python FastAPI Backend (Docx Engine, Database & AI Integrations)
  backend:
    build:
      context: .
      dockerfile: ./webapp/backend/Dockerfile
    container_name: naskara-backend
    restart: always
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=sqlite:////app/webapp/backend/data/pkl_reports.db
      - SECRET_KEY=${SECRET_KEY:-}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:20128/v1}
      - AI_MODEL=${AI_MODEL:-deepseek-opencode}
      - AI_API_KEY=${AI_API_KEY:-not-needed}
    volumes:
      # Persistent sqlite DB volume (Linux native ext4 volume - avoids Windows bind-mount lock & permission issues)
      - sqlite_data:/app/webapp/backend/data
      - ./webapp/uploads:/app/webapp/uploads
      - ./webapp/output:/app/webapp/output
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 2. Frontend React Single Page Application (Served by Nginx)
  frontend:
    build:
      context: ./webapp/frontend
      dockerfile: Dockerfile
    container_name: naskara-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # 3. Cloudflare Tunnel (Auto-connects zimarket.biz.id Outbound without Port Forwarding)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: naskara-tunnel
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  sqlite_data:
