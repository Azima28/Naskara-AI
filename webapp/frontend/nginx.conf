server {
    listen 80;
    server_name localhost;

    # ERR-001 Fix: Hide Nginx version in HTTP response headers & error pages
    server_tokens off;

    # HEADER-002 Fix: Security Headers for Frontend Nginx
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-ancestors 'none';" always;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Allow larger image uploads (for activity photos & logos)
    client_max_body_size 50M;

    # Gzip compression for production asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Static Assets (JS, CSS, images, fonts) built by Vite
    # Return 404 if missing — NEVER fallback to index.html (prevents MIME type mismatch / plain HTML text bug)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 2. Frontend React Single Page Application (SPA) HTML Routes
    # Always send no-cache headers so browser & Cloudflare load latest asset hashes on new deploys
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # 3. Reverse Proxy for FastAPI Backend (/api/*)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Explicit authentication header pass-through
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Access-Token $http_x_access_token;
        proxy_pass_header Authorization;
        proxy_pass_header X-Access-Token;

        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for AI polish & docx generation (up to 5 mins)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
